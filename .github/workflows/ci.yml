name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs-${{ matrix.os }}
          path: |
            .pytest_cache/
            data/*.log
          if-no-files-found: ignore

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Check release tag matches src version
        shell: bash
        run: |
          CURRENT=$(python build/bump_version.py --print)
          echo "Release tag: ${GITHUB_REF_NAME} | src/__init__.py: v${CURRENT}"
          if [ "${GITHUB_REF_NAME}" != "v${CURRENT}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match v${CURRENT} in src/__init__.py"
            exit 1
          fi

      - name: Install Qt system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r build/requirements-build.txt

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File build\build_windows.ps1

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: bash build/build_unix.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            dist/TomoDesk-Setup-*.exe
            dist/TomoDesk-*-x86_64.AppImage
          if-no-files-found: error
          retention-days: 5

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/TomoDesk-Setup-*
            artifacts/TomoDesk-*-x86_64.AppImage
          generate_release_notes: true
